<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
     .flex-practice {
        text-align: center;
        padding: 40px;
    }
    .flex-container {
        display: flex;
        justify-content: space-around;
        margin-top: 40px;
    }
    .box {
        background-color: #52534f;
        width: 50px;
        height: 50px;
        color: white;
        font-size: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

</style>

<body>
  <section>
    <h2>flex practice</h2>
    <p>flextechnic is all about arranging elements in a single direction</p>
    <div class="flex-container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
  </section class="flex-container">
</body>
</html>
