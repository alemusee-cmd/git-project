<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
</head>
<style>
.grid-section {
    text-align: center;
    padding: 40px;
}
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    column-gap: 20px;
    row-gap: 20px;
}

.grid-item {
    background-color:#ffffff;
    height: 200px;

}
.red {
    background-color: #ff0000;
}
.blue {
    background-color: #0000ff;
}
.yellow {
    background-color: #ffff00;
}
.crimson {
    background-color: #dc143c;
}
.green {
    background-color: #008000;
}
.gray {
    background-color: #808080;
}
.pink {
    background-color: #ffc0cb;
}
.skyblue {
    background-color: #87ceeb;
}
</style>
<body>
    <section class="grid-section">
        <h2>grid</h2>
        <p>grid is all about arranging elements in rows and columns</p>
        <div class="grid-container">
            <div class="grid-item red">A</div>
            <div class="grid-item blue">B</div>
            <div class="grid-item yellow">C</div>
            <div class="grid-item crimson">D</div>
            <div class="grid-item green"> E</div>
            <div class="grid-item gray">F</div>
            <div class="grid-item pink">G</div>
            <div class="grid-item skyblue">H</div>
        </div>

    </section>
    
</body>
</html>
