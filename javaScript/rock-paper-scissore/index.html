<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rock-paper-scissore</title>
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <header class="hero-section">
      <h1>Let's game play: Rock-Paper-Scissore</h1>
      <span>🪨📃✂️</span>
    </header>
    <div class="buttons-container">
      <!-- Rock -->
      <button class="Rock" onclick="PlayerGame('Rock')">
        <img src="images/rock-emoji.png" />
      </button>

      <!-- Paper -->
      <button class="Paper" onclick="PlayerGame('Paper')">
        <img src="images/paper-emoji.png" />
      </button>

      <!-- Scissor -->
      <button class="Scissor" onclick="PlayerGame('Scissor')">
        <img src="images/scissor-emoji.png" />
      </button>
    </div>
    <div class="stats-container">
      <p class="picks">
        <!-- innerHTML -->
      </p>
      <p class="result">
        <!-- innerHTML -->
      </p>
      <p class="score">
        <!-- innerHTML -->
      </p>
    </div>
    <div class="reset-game-container">
      <button
        class="reset-btn"
        onclick="
          score.wins = 0;
          score.Draws = 0;
          score.losses = 0;
          localStorage.removeItem('score');
          updateScore();
        "
      >
        Reset game🔄️
      </button>
      <button class="start-auto-btn" onclick="startAuto()">
        ♾️start auto game ♾️
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
